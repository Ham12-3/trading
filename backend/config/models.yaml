# LLM models available for extraction and their prices (USD per 1M tokens, standard tier).
# Prices checked 2026-09-28 at https://developers.openai.com/api/docs/pricing. Update when they change;
# cost_usd on each signal row is computed from this table at extraction time.

defaults:
  bulk: gpt-6-luna          # cheapest current-generation model; used for the full run
  comparison: gpt-5.6-luna  # cheap second model for the Phase 3 accuracy comparison
  prompt_version: v1        # prompt whose signals the API and dashboard show by default

extraction:
  max_input_tokens: 32000   # document budget (approx. 4 chars/token); longer texts are truncated and logged
  max_output_tokens: 4000   # room for any hidden reasoning tokens plus the JSON answer
  concurrency: 4            # parallel requests
  rate_limit_retries: 5     # extra attempts after a rate-limit error, with exponential backoff
  rate_limit_backoff_seconds: 2.0

models:
  gpt-6-luna:
    provider: openai
    input_per_mtok: 0.10
    cached_input_per_mtok: 0.01
    output_per_mtok: 0.50
  gpt-5.6-luna:
    provider: openai
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
  gpt-6-sol:
    provider: openai
    input_per_mtok: 2.00
    cached_input_per_mtok: 0.20
    output_per_mtok: 10.00
