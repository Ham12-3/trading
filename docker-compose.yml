name: newsalpha

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsalpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsalpha}
      POSTGRES_DB: ${POSTGRES_DB:-newsalpha}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-newsalpha}:${POSTGRES_PASSWORD:-newsalpha}@db:5432/${POSTGRES_DB:-newsalpha}
    ports:
      - "8000:8000"
    volumes:
      # Announcement text written by `newsalpha ingest` lives here (gitignored).
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
